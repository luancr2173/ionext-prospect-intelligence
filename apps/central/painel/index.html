<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IONEXT · Prospect Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/painel/icone.svg">
  <meta name="theme-color" content="#0a0a0c">
  <script src="/painel/tema.js"></script>
  <link rel="preload" href="/painel/fontes/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/painel/style.css">
</head>
<body>
  <header class="topo" id="topo" hidden>
    <a class="marca" href="#/" aria-label="IONEXT Prospect Intelligence — visão geral">
      <img class="marca-icone" src="/painel/icone.svg" alt="" width="26" height="26">
      <span class="marca-ionext">ionext</span>
      <span class="marca-produto">Prospect <em>Intelligence</em></span>
    </a>
    <nav class="abas" aria-label="Seções">
      <a href="#/" data-aba="inicio">Visão geral</a>
      <a href="#/funil" data-aba="funil">Funil</a>
      <a href="#/empresas" data-aba="empresas">Empresas</a>
      <a href="#/resultados" data-aba="resultados">Resultados</a>
    </nav>
    <form class="busca-rapida" id="busca-rapida" role="search">
      <input type="search" id="busca-rapida-campo" placeholder="Buscar empresa…  /" aria-label="Buscar empresa por nome ou CNPJ" autocomplete="off">
    </form>
    <div class="motor" id="motor" title="Estado do Motor 01">
      <span class="ponto"></span><span class="motor-texto">Motor 01</span>
    </div>
    <button class="tema" id="tema" type="button" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
      <svg class="icone-sol" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="icone-lua" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button class="botao-texto" id="sair" type="button">Sair</button>
  </header>

  <main id="app" class="conteudo"></main>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
  <script src="/painel/app.js"></script>
</body>
</html>
