name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar schema
        run: |
          # A imagem postgis/postgis instala o PostGIS em public; o Supabase usa o schema extensions.
          psql -h localhost -U postgres -c "drop extension if exists postgis_tiger_geocoder, postgis_topology, fuzzystrmatch, postgis cascade"
          psql -h localhost -U postgres -c "create schema extensions"
          psql -h localhost -U postgres -c "alter database postgres set search_path = public, extensions"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000000_central_schema.sql
      - run: pnpm typecheck
      - run: pnpm test
